[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vega-chip-sdk"
version = "0.1.0"
description = "A software reference model of the Governance Enforcement Unit and the PRE runtime unit (silicon and photonic embodiments), with differential conformance tests against the software jacket."
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "vega-custody-sdk", "vega-governance-jacket-sdk"]
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
